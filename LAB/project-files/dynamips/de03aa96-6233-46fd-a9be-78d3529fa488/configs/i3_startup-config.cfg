!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname EDGE-R1
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$THeJ$hhcuMvHPxVUDSvwYUcjJY.
!
aaa new-model
!
!
aaa authentication login default local
aaa authorization exec default local 
!
!
aaa session-id common
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
ip domain name faimy.local
login block-for 120 attempts 3 within 60
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
username admin privilege 15 secret 5 $1$g.9p$ENuIVf2I5v.EPFv7v3Ge2/
archive
 log config
  hidekeys
! 
!
crypto isakmp policy 10
 encr aes
 authentication pre-share
 group 2
crypto isakmp key 6 cisco123 address 10.0.0.22
!
!
crypto ipsec transform-set VPN-SET esp-aes esp-sha-hmac 
!
crypto map VPN-EDGE1 10 ipsec-isakmp 
 set peer 10.0.0.22
 set transform-set VPN-SET 
 match address 111
!
!
!
ip tcp synwait-time 5
ip ssh time-out 60
ip ssh version 2
!
class-map type inspect match-any CM-OUTSIDE-DMZ
 match protocol http
 match protocol https
class-map type inspect match-any CM-INSIDE-DMZ
 match protocol tcp
 match protocol icmp
class-map type inspect match-any CM-INSIDE-OUT
 match protocol tcp
 match protocol udp
 match protocol icmp
!
!
policy-map type inspect PM-OUTSIDE-DMZ
 class type inspect CM-OUTSIDE-DMZ
  inspect
 class class-default
policy-map type inspect PM-INSIDE-OUT
 class type inspect CM-INSIDE-OUT
  inspect
 class class-default
policy-map type inspect PM-INSIDE-DMZ
 class type inspect CM-INSIDE-DMZ
  inspect
 class class-default
!
zone security INSIDE
zone security OUTSIDE
zone security DMZ
zone-pair security ZP-INSIDE-OUT source INSIDE destination OUTSIDE
 service-policy type inspect PM-INSIDE-OUT
zone-pair security ZP-INSIDE-DMZ source INSIDE destination DMZ
 service-policy type inspect PM-INSIDE-DMZ
zone-pair security ZP-OUTSIDE-DMZ source OUTSIDE destination DMZ
 service-policy type inspect PM-OUTSIDE-DMZ
!
!
!
!
interface Tunnel0
 ip address 10.0.0.110 255.255.255.252
 zone-member security INSIDE
 tunnel source 10.0.0.21
 tunnel destination 10.0.0.22
!
interface FastEthernet0/0
 ip address 203.1.113.1 255.255.255.252
 ip nat outside
 ip virtual-reassembly
 zone-member security OUTSIDE
 duplex auto
 speed auto
!
interface Serial0/0
 ip address 10.0.0.21 255.255.255.252
 ip nat inside
 ip virtual-reassembly
 zone-member security INSIDE
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 7 094F471A1A0A464058
 clock rate 2000000
 crypto map VPN-EDGE1
!
interface FastEthernet0/1
 ip address 10.0.0.101 255.255.255.252
 ip nat inside
 ip virtual-reassembly
 zone-member security INSIDE
 duplex auto
 speed auto
!
