!
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes
 area 1 range 10.0.0.16 255.255.255.248
 area 2 range 10.0.0.24 255.255.255.248
 area 3 range 10.0.0.40 255.255.255.248
 area 4 range 10.0.0.48 255.255.255.248
 area 5 range 10.0.0.32 255.255.255.248
 network 10.0.0.0 0.0.0.3 area 0
 network 10.0.0.4 0.0.0.3 area 0
 network 10.0.0.20 0.0.0.3 area 1
 network 10.0.0.24 0.0.0.3 area 2
 network 10.0.0.32 0.0.0.3 area 5
 network 10.0.0.44 0.0.0.3 area 3
 network 10.0.0.52 0.0.0.3 area 4
 network 203.1.113.0 0.0.0.3 area 0
!
ip forward-protocol nd
ip route 10.0.0.100 255.255.255.252 10.0.0.102 200
!
!
no ip http server
no ip http secure-server
ip nat inside source list NAT-ACL interface FastEthernet0/0 overload
!
ip access-list extended NAT-ACL
 permit ip 172.16.0.0 0.0.255.255 any
