!
!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R3
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
no ip dhcp use vrf connected
ip dhcp excluded-address 192.168.50.1
ip dhcp excluded-address 192.168.60.1
!
ip dhcp pool SALES-LAN
   network 192.168.50.0 255.255.255.0
   default-router 192.168.50.1 
!
ip dhcp pool MAR-LAN
   network 192.168.60.0 255.255.255.0
   default-router 192.168.60.1 
!
!
no ip domain lookup
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface FastEthernet0/0
 ip address 10.0.0.82 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 cisco123
 duplex auto
 speed auto
!
interface Serial0/0
 ip address 10.0.0.97 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 cisco123
 clock rate 2000000
!
interface FastEthernet0/1
 no ip address
 duplex auto
 speed auto
!
interface Serial0/1
 ip address 10.0.0.94 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 cisco123
 clock rate 2000000
!
interface Serial0/2
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/3
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/4
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/5
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet1/0
 ip address 10.0.0.70 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 cisco123
 duplex auto
 speed auto
!
interface FastEthernet2/0
 no ip address
 duplex auto
 speed auto
!
interface FastEthernet2/0.10
 encapsulation dot1Q 50
 ip address 192.168.50.1 255.255.255.0
!
interface FastEthernet2/0.20
 encapsulation dot1Q 60
 ip address 192.168.60.1 255.255.255.0
!
router ospf 1
 log-adjacency-changes
 passive-interface FastEthernet2/0
 network 10.0.0.68 0.0.0.3 area 0
 network 10.0.0.80 0.0.0.3 area 0
 network 10.0.0.92 0.0.0.3 area 0
 network 10.0.0.96 0.0.0.3 area 0
 network 192.168.50.0 0.0.0.255 area 0
 network 192.168.60.0 0.0.0.255 area 0
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
