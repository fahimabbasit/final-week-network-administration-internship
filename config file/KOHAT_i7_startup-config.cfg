!
!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname KOHAT
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
no ip dhcp use vrf connected
ip dhcp excluded-address 172.16.0.1
!
ip dhcp pool KOHAT-LAN
   network 172.16.0.0 255.255.0.0
   default-router 172.16.0.1 
!
!
no ip domain lookup
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
crypto isakmp policy 10
 encr aes
 authentication pre-share
 group 2
crypto isakmp key 6 cisco123 address 10.0.0.17
crypto isakmp key 6 cisco123 address 10.0.0.21
!
!
crypto ipsec transform-set VPN-SET esp-aes esp-sha-hmac 
!
crypto map VPN-EDGE1 10 ipsec-isakmp 
 set peer 10.0.0.21
 set transform-set VPN-SET 
 match address 111
!
crypto map VPN-MAP 10 ipsec-isakmp 
 set peer 10.0.0.17
 set transform-set VPN-SET 
 match address 110
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Tunnel0
 ip address 10.0.0.109 255.255.255.252
 tunnel source 10.0.0.22
 tunnel destination 10.0.0.21
!
interface FastEthernet0/0
 ip address 172.16.0.1 255.255.0.0
 speed 100
 full-duplex
!
interface Serial0/0
 ip address 10.0.0.22 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 cisco123
 clock rate 2000000
 crypto map VPN-EDGE1
!
interface FastEthernet0/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface Serial0/1
 ip address 10.0.0.18 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 cisco123
 clock rate 2000000
 crypto map VPN-MAP
!
interface Serial0/2
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/3
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/4
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/5
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet1/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
router ospf 1
 log-adjacency-changes
 passive-interface FastEthernet0/0
 network 10.0.0.16 0.0.0.3 area 1
 network 10.0.0.20 0.0.0.3 area 1
 network 10.0.0.104 0.0.0.3 area 1
 network 172.16.0.0 0.0.255.255 area 1
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
access-list 110 permit gre host 10.0.0.18 host 10.0.0.17
access-list 111 permit gre host 10.0.0.22 host 10.0.0.21
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
