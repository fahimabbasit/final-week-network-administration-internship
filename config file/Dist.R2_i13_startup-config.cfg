!
!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R2
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
no ip dhcp use vrf connected
ip dhcp excluded-address 192.168.30.1
ip dhcp excluded-address 192.168.40.1
!
ip dhcp pool MGT-LAN
   network 192.168.30.0 255.255.255.0
   default-router 192.168.30.1 
!
ip dhcp pool AUD-LAN
   network 192.168.40.0 255.255.255.0
   default-router 192.168.40.1 
!
!
no ip domain lookup
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface FastEthernet0/0
 ip address 10.0.0.66 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 cisco123
 duplex auto
 speed auto
!
interface Serial0/0
 ip address 10.0.0.90 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 cisco123
 clock rate 2000000
!
interface FastEthernet0/1
 no ip address
 duplex auto
 speed auto
!
interface Serial0/1
 ip address 10.0.0.93 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 cisco123
 clock rate 2000000
!
interface Serial0/2
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/3
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/4
 no ip address
 shutdown
 clock rate 2000000
!
interface Serial0/5
 no ip address
 shutdown
 clock rate 2000000
!
interface FastEthernet1/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet1/0.10
 encapsulation dot1Q 30
 ip address 192.168.30.1 255.255.255.0
!
interface FastEthernet1/0.20
 encapsulation dot1Q 40
 ip address 192.168.40.1 255.255.255.0
!
interface FastEthernet2/0
 ip address 10.0.0.78 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 cisco123
 duplex auto
 speed auto
!
router ospf 1
 log-adjacency-changes
 passive-interface FastEthernet1/0
 network 10.0.0.64 0.0.0.3 area 0
 network 10.0.0.76 0.0.0.3 area 0
 network 10.0.0.88 0.0.0.3 area 0
 network 10.0.0.92 0.0.0.3 area 0
 network 192.168.30.0 0.0.0.255 area 0
 network 192.168.40.0 0.0.0.255 area 0
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
